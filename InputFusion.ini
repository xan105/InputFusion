[API]
; GAMEPAD API(s) to hook/detour.
:
; If InputFusion is running in DLL injection mode (InputFusion.dll) 
; You must select which API to "enable" by hooking/detouring or 
; InputFusion will do nothing besides initialisation.
;
; If InputFusion is running in DLL sideloading mode (XInput__.dll, dinput8.dll, etc.)
; Then InputFusion is already acting as the DLL replacement,
; So the API you are sideloading is already "enable", only hook/detour it if needed!
; You can also hook/detour any other API.
:
; For example, Games that supports both DInput8 and XInput tend to have double Input issues.
; - When running as XInput__.dll you would hook/detour DInput8
; - When running in DLL injection mode (InputFusion.dll) you would hook/detour both APIs.
; Then you would set the DInput8 flag option to not report any devices when enumerating devices.
GAMEINPUT   = false
XINPUT      = false
DINPUT8     = false
DINPUT      = false
WINMM       = false

[SDL]
; When enabled the LED light of the controller is used to show the battery level of the controller:
; - 100% / Green
; - 75% / Yellow
; - 50% / Orange
; - 25% / Red
; Currently only available for PS4/PS5 controller in wireless.
GAMEPAD_LED_BATTERY_LVL=false

; Disable motor vibration. 
; This includes "Impulse Triggers" on newer Xbox controllers.
DISABLE_GAMEPAD_RUMBLE=false

; Which Input APIs should be used by SDL to communicate with your gamepad.
; Similar to SDL_SetHint(SDL_HINT, "1"|"0");
HIDAPI      = true
GAMEINPUT   = true
WGI         = true
XINPUT      = true
DINPUT8     = true
RAWINPUT    = false

; SDL has the ability to change the mapping of an existing gamepad or add support for gamepads that SDL is unaware of.
; The mapping string has the format: `GUID,name,mapping`.
; Similar to SDL_SetHint(SDL_HINT_GAMECONTROLLERCONFIG, "GUID,name,mapping");
; See [SDL_HINT_GAMECONTROLLERCONFIG](https://wiki.libsdl.org/SDL3/SDL_HINT_GAMECONTROLLERCONFIG).
CONTROLLER_MAPPING = ""

; Path to file with extra gamecontroller db entries.
; Similar to SDL_SetHint(SDL_HINT_GAMECONTROLLERCONFIG_FILE, "/path/to/file");
; See [SDL_HINT_GAMECONTROLLERCONFIG_FILE](https://wiki.libsdl.org/SDL3/SDL_HINT_GAMECONTROLLERCONFIG_FILE).
CONTROLLER_MAPPING_FILE = ""

[XInput]
; All XInput slots will report as connected, returning dummy data when necessary.  
; This helps with games that do not properly handle gamepad disconnection (hot reload), 
; as they may not retry after receiving ERROR_DEVICE_NOT_CONNECTED.
; Example: "Tormented Souls 2" (2464280) and "Fuga: Melodies of Steel 3" (3081320)
DEVICE_ALWAYS_CONNECTED=false

[DInput8]
; Do not return any devices when enumerating devices.
NO_DEVICES=false

[WinMM]
; Use the modern Xbox controller layout with WinMM. 
; Useful for modern games that decided to use a legacy API for a Xbox controller 
; such as "Deadly Premonition" (247660).
XBOX_LAYOUT=false